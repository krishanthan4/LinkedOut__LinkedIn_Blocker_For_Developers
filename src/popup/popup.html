<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <style>
    :root {
      --linkedin-blue: #0a66c2;
      --leetcode-orange: #ffa116;
      --bg-dark: #1b1f23;
      --card-bg: #24292e;
      --text-main: #e6edf3;
      --text-muted: #c0c0c0;
    }

    body {
      width: 310px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .container {
      padding: 8px;
    }

    header {
      text-align: center;
      margin-bottom: 4px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 4px;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0;
      background: linear-gradient(90deg, var(--linkedin-blue), var(--leetcode-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 0.9rem;
      margin: 0 0 4px 0;
    }

    .status-card {
      background: rgba(10, 102, 194, 0.1);
      border: 1px solid var(--linkedin-blue);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      margin-bottom: 8px;
    }

    .status-active {
      color: #3fb950;
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .features {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
    }

    .feature-item {
      background: var(--card-bg);
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--leetcode-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feature-item.li { border-left-color: var(--linkedin-blue); }

    .feature-text span { font-size: 0.75rem; color: var(--text-muted); }

    .section {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #30363d;
    }

    .form-group {
      margin-bottom: 4px;
      font-size: 0.8rem;
    }

    .radio-group {
      background: #0d1117;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .radio-label {
      display: flex;
      gap: 6px;
      margin-bottom: 2px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .btn-secondary {
      width: 100%;
      background: #30363d;
      color: white;
      border: 1px solid #444c56;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: #444c56;
    }

    .segmented-control {
      display: flex;
      background: #0d1117;
      border-radius: 6px;
      padding: 2px;
      border: 1px solid #30363d;
    }

    .segmented-control input[type="radio"] {
      display: none;
    }

    .segmented-control label {
      flex: 1;
      text-align: center;
      padding: 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .segmented-control input[type="radio"]:checked + label {
      background: var(--linkedin-blue);
      color: white;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LinkedOut</h1>
      <p style="font-size: 0.75rem; color: var(--text-muted); font-style: italic; margin-top: 4px;">
        "Solve a LeetCode a day to keep the 'jobless' away"
      </p>
    </header>

    <div class="features">
      <div class="feature-item">
        <span>🚫</span>
        <div class="feature-text">
          <span>Less Scrolling</span>
        </div>
      </div>
      <div class="feature-item">
        <span>💡</span>
        <div class="feature-text">
          <span>Solve LeetCode to See Profiles</span>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Usage Controls</h2>
      
      <!-- Usage Mode Selection -->
      <div class="form-group">
        <label style="margin-bottom: 8px; display: block;">Usage Mode:</label>
        <div class="segmented-control">
          <input type="radio" name="usageMode" value="dailyLimit" id="modeDaily" checked>
          <label for="modeDaily">1 Hour Daily</label>
          
          <input type="radio" name="usageMode" value="timeBlock" id="modeScheduled">
          <label for="modeScheduled">Scheduled Time</label>
        </div>
      </div>

      <!-- Start Time (Hidden by default unless Time Time is selected) -->
      <div class="form-group" id="startTimeContainer" style="display: none; margin-top: 8px;">
        <label for="startTime">Daily Start Time (1 Hour):</label>
        <input type="time" id="startTime" style="font-size: 0.8rem; padding: 4px; width: 100%; box-sizing: border-box; margin-top: 4px;" />
      </div>

      <div class="divider" style="height: 1px; background: #30363d; margin: 10px 0;"></div>

      <!-- Timeout Action -->
      <div class="form-group">
        <label style="margin-bottom: 8px; display: block;">When Time Ends:</label>
        <div class="segmented-control">
          <input type="radio" name="timeoutAction" value="block" id="actionBlock" checked>
          <label for="actionBlock" style="border-right: 1px solid transparent;">Block Page</label>
          
          <input type="radio" name="timeoutAction" value="focus" id="actionFocus">
          <label for="actionFocus">Focus Mode</label>
        </div>
      </div>

      <button id="saveBtn" class="btn-secondary" style="margin-top: 10px; background: var(--linkedin-blue); border: none;">Save Settings</button>
      <div id="saveStatus" style="text-align: center; font-size: 0.7rem; color: #3fb950; min-height: 1em; margin-top: 2px;"></div>
    </div>

    <button id="optionsBtn" class="btn-secondary">
      Open Options
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
